site_name: amail-md
site_description: Markdown to email-safe HTML — Python library
site_url: https://aros-team.github.io/amail_md/
repo_url: https://github.com/Aros-Team/amail_md
repo_name: Aros-Team/amail_md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference: api-reference.md
  - Examples: examples.md
  - Changelog: changelog.md
  - Contributing:
      - Overview: contributing/index.md
      - Architecture: contributing/architecture.md
      - Development Workflow: contributing/development.md
      - Conventions: contributing/conventions.md
      - Testing: contributing/testing.md
      - ADRs: adrs/index.md

exclude_docs: |
  harness/
